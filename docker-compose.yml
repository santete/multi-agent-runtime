services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mar
      POSTGRES_PASSWORD: mar
      POSTGRES_DB: mar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mar"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
